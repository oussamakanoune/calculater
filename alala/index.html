<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENSTA Grade Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0eff8;min-height:100vh;padding:2rem 1rem 4rem}
.app{max-width:700px;margin:0 auto}
h1{font-size:26px;font-weight:600;color:#1a1a2e;margin-bottom:4px}
h1 span{color:#534AB7}
.subtitle{font-size:14px;color:#888;margin-bottom:2rem}
.module-card{background:#fff;border:1px solid #e5e3f5;border-radius:16px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(83,74,183,.07)}
.module-top{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.module-name-input{flex:1;min-width:140px;height:40px;background:#f5f4fc;border:1px solid #e0ddf5;border-radius:10px;padding:0 12px;font-size:14px;font-weight:500;color:#1a1a2e;outline:none}
.module-name-input:focus{border-color:#534AB7}
.module-name-input::placeholder{color:#bbb;font-weight:400}
.coeff-wrap{display:flex;align-items:center;gap:6px}
.coeff-label{font-size:12px;color:#888;white-space:nowrap}
.coeff-input{width:54px;height:40px;background:#f5f4fc;border:1px solid #e0ddf5;border-radius:10px;padding:0 8px;font-size:13px;text-align:center;color:#1a1a2e;outline:none}
.coeff-input:focus{border-color:#534AB7}
.avg-badge{background:#eeedfe;color:#3c3489;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.avg-badge.warn{background:#fff3cd;color:#7d5a00}
.avg-badge.pass{background:#d0e9ff;color:#0c447c}
.avg-badge.good{background:#d4edda;color:#1a5c2e}
.delete-btn{background:none;border:none;cursor:pointer;color:#bbb;padding:6px;border-radius:8px;font-size:20px;display:flex;align-items:center;transition:all .15s}
.delete-btn:hover{color:#E24B4A;background:#fff0f0}
.grades-grid{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-bottom:8px;align-items:center}
.grade-type-input,.grade-val-input{height:38px;background:#f5f4fc;border:1px solid #e0ddf5;border-radius:10px;padding:0 10px;font-size:13px;color:#1a1a2e;outline:none;width:100%;font-family:inherit}
.grade-type-input:focus,.grade-val-input:focus{border-color:#534AB7}
.grade-type-input::placeholder,.grade-val-input::placeholder{color:#bbb}
.remove-grade-btn{background:none;border:1px solid #e0ddf5;border-radius:8px;cursor:pointer;color:#bbb;width:36px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s}
.remove-grade-btn:hover{color:#E24B4A;border-color:#E24B4A;background:#fff0f0}
.add-grade-btn{width:100%;height:38px;background:#eeedfe;border:none;border-radius:10px;color:#534AB7;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;transition:background .15s;font-family:inherit}
.add-grade-btn:hover{background:#d9d7f8}
.formula-row{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #f0eff8}
.formula-label{font-size:12px;color:#888;background:#f5f4fc;border:1px solid #e0ddf5;border-radius:10px;padding:0 10px;height:38px;display:flex;align-items:center;white-space:nowrap}
.formula-col{flex:1}
.formula-input{width:100%;height:38px;background:#f5f4fc;border:1px solid #e0ddf5;border-radius:10px;padding:0 10px;font-size:13px;color:#1a1a2e;font-family:monospace;outline:none}
.formula-input:focus{border-color:#534AB7}
.formula-input::placeholder{color:#bbb;font-family:inherit}
.formula-hint{font-size:11px;color:#aaa;margin-top:4px}
.error-msg{font-size:11px;color:#c0392b;margin-top:3px}
.add-module-btn{width:100%;height:48px;background:#534AB7;border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1.5rem;transition:background .15s;font-family:inherit;letter-spacing:.3px}
.add-module-btn:hover{background:#3c3489}
.summary-card{background:#fff;border:1px solid #e5e3f5;border-radius:16px;padding:1.25rem;margin-top:2rem;box-shadow:0 2px 8px rgba(83,74,183,.07)}
.summary-title{font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f4fc;font-size:14px}
.summary-row:last-child{border-bottom:none}
.summary-name{color:#1a1a2e}
.summary-coeff{color:#bbb;font-size:12px}
.summary-grade{font-weight:600}
.summary-grade.fail{color:#c0392b}
.summary-grade.pass{color:#0c447c}
.summary-grade.good{color:#1a5c2e}
.final-avg{margin-top:1rem;padding-top:1rem;border-top:2px solid #eeedfe;display:flex;justify-content:space-between;align-items:center}
.final-avg-label{font-size:16px;font-weight:600;color:#1a1a2e}
.final-avg-value{font-size:32px;font-weight:700}
.final-avg-value.fail{color:#c0392b}
.final-avg-value.pass{color:#185FA5}
.final-avg-value.good{color:#1a5c2e}
.final-avg-value.none{color:#ccc}
.mention{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;margin-top:4px}
.mention.fail{background:#fdecea;color:#c0392b}
.mention.pass{background:#d0e9ff;color:#0c447c}
.mention.good{background:#d4edda;color:#1a5c2e}
svg.icon{width:18px;height:18px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <h1>&#127979; ENSTA <span>Grade Calculator</span></h1>
  <p class="subtitle">Add your modules, grades, formula &rarr; see your average instantly</p>
  <div id="modules-container"></div>
  <button class="add-module-btn" onclick="addModule()">+ Add Module</button>
  <div class="summary-card" id="summary-card" style="display:none">
    <div class="summary-title">&#128202; Summary</div>
    <div id="summary-rows"></div>
    <div class="final-avg">
      <div>
        <div class="final-avg-label">Yearly Average</div>
        <div id="mention-badge"></div>
      </div>
      <div class="final-avg-value none" id="final-avg-val">&mdash;</div>
    </div>
  </div>
</div>
<script>
let modules=[],nextId=1;
function addModule(){
  const id=nextId++;
  modules.push({id,name:'',coeff:1,grades:[{id:nextId++,type:'TD',value:''},{id:nextId++,type:'Exam',value:''}],formula:'TD*0.4 + Exam*0.6',avg:null,error:''});
  render();
}
function removeModule(id){modules=modules.filter(m=>m.id!==id);render();}
function addGrade(mid){const m=modules.find(m=>m.id===mid);if(m){m.grades.push({id:nextId++,type:'',value:''});render();}}
function removeGrade(mid,gid){const m=modules.find(m=>m.id===mid);if(!m)return;m.grades=m.grades.filter(g=>g.id!==gid);recalc(m);render();}
function recalc(m){
  if(!m.formula.trim()){m.avg=null;m.error='';return;}
  let allEmpty=true;
  const vars={};
  for(const g of m.grades){
    const k=g.type.trim().replace(/\s+/g,'_');if(!k)continue;
    const v=parseFloat(g.value);
    vars[k]=isNaN(v)?null:v;
    if(!isNaN(v))allEmpty=false;
  }
  if(allEmpty){m.avg=null;m.error='';return;}
  let expr=m.formula;
  for(const[k,v]of Object.entries(vars)){
    if(v===null){m.avg=null;m.error='Missing grade for "'+k+'"';return;}
    expr=expr.replace(new RegExp('\\b'+k+'\\b','g'),v);
  }
  try{
    const r=Function('"use strict";return('+expr+')')();
    if(typeof r!=='number'||isNaN(r)||!isFinite(r)){m.avg=null;m.error='Formula error';}
    else{m.avg=Math.round(r*100)/100;m.error='';}
  }catch(e){m.avg=null;m.error='Invalid formula';}
}
function ac(v){if(v===null)return '';if(v<10)return 'warn';if(v<12)return 'pass';return 'good';}
function mention(v){
  if(v===null)return{text:'',cls:''};
  if(v<10)return{text:'Insufficient',cls:'fail'};
  if(v<12)return{text:'Passing',cls:'pass'};
  if(v<14)return{text:'Good',cls:'good'};
  if(v<16)return{text:'Very Good',cls:'good'};
  return{text:'Excellent',cls:'good'};
}
function renderModule(m){
  const avgTxt=m.avg!==null?m.avg.toFixed(2):'0.00';
  const bc='avg-badge'+(m.avg!==null?' '+ac(m.avg):'');
  const vars=m.grades.filter(g=>g.type.trim()).map(g=>g.type.trim()).join(', ');
  const hint=vars?'Variables: '+vars:'Name grade types above to use in formula';
  const gradesHTML=m.grades.map(g=>`
    <div class="grades-grid">
      <input class="grade-type-input" placeholder="Type (TD, TP, Exam...)" value="${g.type}" oninput="upType(${m.id},${g.id},this.value)"/>
      <input class="grade-val-input" type="number" step="0.01" min="0" max="20" placeholder="Grade /20" value="${g.value}" oninput="upVal(${m.id},${g.id},this.value)"/>
      <button class="remove-grade-btn" onclick="removeGrade(${m.id},${g.id})">&#8722;</button>
    </div>`).join('');
  return`<div class="module-card" id="mod-${m.id}">
    <div class="module-top">
      <input class="module-name-input" placeholder="Module name" value="${m.name}" oninput="upName(${m.id},this.value)"/>
      <div class="coeff-wrap"><span class="coeff-label">Coeff</span>
        <input class="coeff-input" type="number" step="0.5" min="0.5" value="${m.coeff}" oninput="upCoeff(${m.id},this.value)"/>
      </div>
      <span class="${bc}">Avg: ${avgTxt}</span>
      <button class="delete-btn" onclick="removeModule(${m.id})">&#128465;</button>
    </div>
    ${gradesHTML}
    <button class="add-grade-btn" onclick="addGrade(${m.id})">+ Add grade</button>
    <div class="formula-row">
      <span class="formula-label">&#402; Formula</span>
      <div class="formula-col">
        <input class="formula-input" placeholder="e.g. TD*0.4 + Exam*0.6" value="${m.formula}" oninput="upFormula(${m.id},this.value)"/>
        <div class="formula-hint">${hint}</div>
        ${m.error?'<div class="error-msg">&#9888; '+m.error+'</div>':''}
      </div>
    </div>
  </div>`;
}
function renderSummary(){
  const card=document.getElementById('summary-card');
  const rowsEl=document.getElementById('summary-rows');
  const finalEl=document.getElementById('final-avg-val');
  const mentionEl=document.getElementById('mention-badge');
  if(modules.length===0){card.style.display='none';return;}
  card.style.display='block';
  let totalCoeff=0,wSum=0;
  let rows='';
  for(const m of modules){
    const name=m.name||'Unnamed module';
    const coeff=parseFloat(m.coeff)||1;
    const str=m.avg!==null?m.avg.toFixed(2)+' / 20':'—';
    const cls=m.avg!==null?(m.avg<10?'fail':m.avg<12?'pass':'good'):'';
    rows+=`<div class="summary-row"><div><span class="summary-name">${name}</span> <span class="summary-coeff">· coeff ${coeff}</span></div><span class="summary-grade ${cls}">${str}</span></div>`;
    if(m.avg!==null){wSum+=m.avg*coeff;totalCoeff+=coeff;}
  }
  rowsEl.innerHTML=rows;
  if(totalCoeff>0){
    const final=Math.round(wSum/totalCoeff*100)/100;
    const cls=final<10?'fail':final<12?'pass':'good';
    finalEl.textContent=final.toFixed(2)+' / 20';
    finalEl.className='final-avg-value '+cls;
    const{text,cls:mc}=mention(final);
    mentionEl.innerHTML=text?`<span class="mention ${mc}">${text}</span>`:'';
  }else{finalEl.textContent='—';finalEl.className='final-avg-value none';mentionEl.innerHTML='';}
}
function render(){
  document.getElementById('modules-container').innerHTML=modules.map(renderModule).join('');
  renderSummary();
}
function upName(id,v){const m=modules.find(m=>m.id===id);if(m){m.name=v;renderSummary();}}
function upCoeff(id,v){const m=modules.find(m=>m.id===id);if(m){m.coeff=parseFloat(v)||1;renderSummary();}}
function upType(mid,gid,v){
  const m=modules.find(m=>m.id===mid);if(!m)return;
  const g=m.grades.find(g=>g.id===gid);if(g){g.type=v;recalc(m);}
  const el=document.getElementById('mod-'+mid);
  if(el){
    const vars=m.grades.filter(g=>g.type.trim()).map(g=>g.type.trim()).join(', ');
    const h=el.querySelectorAll('.formula-hint');h.forEach(x=>x.textContent=vars?'Variables: '+vars:'Name grade types above to use in formula');
    const b=el.querySelector('[class*="avg-badge"]');if(b){b.textContent='Avg: '+(m.avg!==null?m.avg.toFixed(2):'0.00');b.className='avg-badge'+(m.avg!==null?' '+ac(m.avg):'');}
    const e=el.querySelector('.error-msg');if(e)e.textContent=m.error?'⚠ '+m.error:'';
  }
  renderSummary();
}
function upVal(mid,gid,v){
  const m=modules.find(m=>m.id===mid);if(!m)return;
  const g=m.grades.find(g=>g.id===gid);if(g){g.value=v;recalc(m);}
  const el=document.getElementById('mod-'+mid);
  if(el){
    const b=el.querySelector('[class*="avg-badge"]');if(b){b.textContent='Avg: '+(m.avg!==null?m.avg.toFixed(2):'0.00');b.className='avg-badge'+(m.avg!==null?' '+ac(m.avg):'');}
    const e=el.querySelector('.error-msg');if(e)e.textContent=m.error?'⚠ '+m.error:'';
  }
  renderSummary();
}
function upFormula(mid,v){
  const m=modules.find(m=>m.id===mid);if(!m)return;
  m.formula=v;recalc(m);
  const el=document.getElementById('mod-'+mid);
  if(el){
    const b=el.querySelector('[class*="avg-badge"]');if(b){b.textContent='Avg: '+(m.avg!==null?m.avg.toFixed(2):'0.00');b.className='avg-badge'+(m.avg!==null?' '+ac(m.avg):'');}
    const e=el.querySelector('.error-msg');if(e)e.textContent=m.error?'⚠ '+m.error:'';
  }
  renderSummary();
}
addModule();
</script>
</body>
</html>
